<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gestion scolaire{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Font Awesome : icônes des boutons (TD3) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        .btn { display: inline-block; padding: 4px 9px; border: none; border-radius: 4px;
               color: #fff; text-decoration: none; cursor: pointer; font-size: 14px; }
        .btn-edit { background: #337ab7; }
        .btn-del { background: #d9534f; }
        .btn-abs { background: #5cb85c; }
        .photo-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 50%; }
        .photo-big { max-width: 200px; border-radius: 8px; }
        form.inline { display: inline; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Étudiants</a>
        <a href="{{ url_for('list_classes') }}">Classes</a>
        <a href="{{ url_for('list_matieres') }}">Matières</a>
        <a href="{{ url_for('add_absence') }}">Ajouter une absence</a>
        <a href="/admin">Administration</a>
    </nav>
    <hr>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="{{ category }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
