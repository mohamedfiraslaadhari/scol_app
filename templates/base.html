<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gestion scolaire{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Étudiants</a>
        <a href="{{ url_for('list_classes') }}">Classes</a>
        <a href="{{ url_for('list_matieres') }}">Matières</a>
        <a href="{{ url_for('add_absence') }}">Ajouter une absence</a>
    </nav>
    <hr>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="{{ category }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
